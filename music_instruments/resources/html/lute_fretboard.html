<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lute fretboard</title>
<style>
  /* Palette: forge_music_theory_style_guide.md, "Color scheme" (revised 2026-09-25).
     Same values as monochord.html, piano_keyboard.html and guitar_fretboard.html. */
  :root {
    --paper: #FDFCFA;   /* Vault Background (Paper) */
    --ink: #2B2B2B;     /* Title Text */
    --muted: #555555;   /* Body Text / Plot Labels */
    --axis: #666666;    /* Axis Lines / Strong Ticks */
    --grid: #F2F2EC;    /* Faint Gridlines / Fine Ticks */
    --left: #2B2B2B;    /* Primary Signal / Input 1 */
    --right: #B39373;   /* Secondary Signal / Input 2 */
    --right-text: #7A644E; /* --right darkened for legible TEXT on the paper background */
    --derived: #64748B; /* Combined / Derived Series */
    --highlight: #F8C54B; /* Highlight: a held position */
    --accent: #D72027;  /* Primary Accent: keyboard focus, and the true-equal-tempered marker */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--muted);
    padding: 8px 10px 14px;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 700px; margin: 0 auto; }
  /* Thirteen positions per course do not fit a phone at a tappable size, so the
     fretboard keeps a minimum width and scrolls sideways there. */
  .scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
  svg { display: block; width: 100%; min-width: 600px; height: auto; user-select: none; -webkit-user-select: none; }
  .pt { cursor: pointer; }
  .pt:focus { outline: none; }
  /* Each position is a small dot; hovering, focusing or holding it swaps in a
     disc that carries the note name, so 78 labels never clutter the board. */
  .pt .dot { fill: var(--axis); opacity: 0.35; }
  .pt .disc { fill: #FFFFFF; stroke: var(--axis); stroke-width: 1; opacity: 0; }
  .pt text { fill: var(--ink); font-size: 9px; opacity: 0; pointer-events: none; }
  .pt:hover .disc, .pt:hover text { opacity: 1; }
  .pt:hover .dot { opacity: 0; }
  .pt.held .disc { opacity: 1; fill: var(--highlight); stroke: var(--ink); stroke-width: 1.5; }
  .pt.held text { opacity: 1; }
  .pt.held .dot { opacity: 0; }
  /* Plain :focus (not :focus-visible): a mouse click focuses the point too, and
     :focus-visible would hide the ring exactly when the user clicked it. */
  .pt:focus .disc { opacity: 1; stroke: var(--accent); stroke-width: 3; }
  .pt:focus text { opacity: 1; }
  .pt:focus .dot { opacity: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 10px; }
  button {
    font: inherit; font-size: 13px; color: var(--ink);
    background: #fff; border: 1px solid var(--axis); border-radius: 6px;
    padding: 8px 12px; cursor: pointer; min-height: 40px;
  }
  button:hover { border-color: var(--ink); }
  button:active { background: var(--grid); }
  button.left  { border-color: var(--left);  color: var(--left); }
  /* Role shows in COLOR only: same border weight, radius and text weight on every button.
     The Secondary-Signal tan (--right) is a line/fill color and is only 2.9:1 against white as a
     1px border, so it read as a thinner, washed-out border; use its text-safe darker shade. */
  button.right { border-color: var(--right-text); color: var(--right-text); }
  button.both  { border-color: var(--derived); color: var(--derived); }
</style>
</head>
<body>
<div class="wrap">

<div class="scroller"><svg id="svg" role="group" aria-label="Lute fretboard, six courses, Rule of Eighteen frets 0 to 12. Click a position to hold it, then play the held notes. Arrow keys move between positions. A dashed line at fret 12 shows where a true equal-tempered octave would sit."></svg></div>

<div class="controls">
  <button class="both"  id="bT" title="All held notes at once, as a chord">Play together</button>
  <button class="left"  id="bU" title="Held notes one at a time, lowest to highest">Play ascending</button>
  <button class="right" id="bD" title="Held notes one at a time, highest to lowest">Play descending</button>
  <button id="bC" title="Release every held position">Clear</button>
</div>

</div>
<script>
(function () {
  "use strict";

  // --- pure math (no DOM) ------------------------------------------------
  // Standard concert pitch, 12-tone equal temperament for the OPEN courses and for the
  // note-name labels: A4 (MIDI 69) = 440 Hz.
  var A4_HZ = 440;
  // Renaissance 6-course lute in G, low course to high (MIDI numbers): G2 C3 F3 A3 D4 G4 —
  // fourth, fourth, MAJOR THIRD (course 3->4), fourth, fourth, matching the vault note's own
  // stated interval pattern (and lute.md's own interval description) exactly.
  var TUNING = [43, 48, 53, 57, 62, 67];
  var FRETS = 12;                                // frets 0 (open) .. 12
  var STAGGER = 0.2;                             // seconds between arpeggio onsets
  var NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  function midiToHz(m) { return A4_HZ * Math.pow(2, (m - 69) / 12); }
  function midiToName(m) { return NAMES[m % 12] + (Math.floor(m / 12) - 1); }   // scientific pitch notation
  // Galilei's Rule of Eighteen: each fret sits at 1/18 of the REMAINING string length below the
  // previous fret, so after n frets the fraction of the ORIGINAL open length left to vibrate is
  // (17/18)^n — iterative, not a single formula reset every 12 frets like 12-TET's 2^(-n/12).
  var ROE = 17 / 18;
  function fretFraction(n) { return Math.pow(ROE, n); }               // fraction of open length remaining
  // Fret n on a course sounds this many cents above the open course: pitch is inversely
  // proportional to length, so cents = -1200*log2(fraction remaining). NOT n*100 — that's the
  // whole point of the rule; see fret12DriftCents below for exactly how far off it drifts.
  function fretCents(n) { return -1200 * Math.log2(fretFraction(n)); }
  // How flat the Rule-of-Eighteen's fret 12 is from a true equal-tempered octave (1200 cents).
  // Computed, not assumed: this file's own §Testing note originally guessed ~13.6 cents; the
  // actual construction gives about 12.5 cents. See FEEDBACK for the discrepancy.
  function fret12DriftCents() { return fretCents(12) - 1200; }
  // The label on each fret is the nearest EQUAL-TEMPERED semitone name (open course + n
  // semitones) — the same naming a guitar fret would get. The SOUND is the real Rule-of-Eighteen
  // frequency below, which is up to ~12.5 cents flat of that name by fret 12. That gap between
  // "what the fret is called" and "what it actually sounds" is the whole point of this gadget.
  function midiAt(s, f) { return TUNING[s] + f; }
  function hzAt(s, f) { return midiToHz(TUNING[s]) * Math.pow(1 / ROE, f); }   // true Rule-of-Eighteen pitch
  function posKey(s, f) { return s + ":" + f; }
  function parseKey(k) { var p = k.split(":"); return { s: +p[0], f: +p[1] }; }
  // A held position set (keys "string:fret") in ascending pitch order; equal
  // pitches keep the lower course first.
  function sortedHeld(held) {
    return Array.from(held).map(parseKey).sort(function (a, b) {
      return (midiAt(a.s, a.f) - midiAt(b.s, b.f)) || (a.s - b.s);
    });
  }
  // What to sound for a held set: [{s, f, midi, hz, when}] with `when` in seconds
  // from the button press. An empty set gives an empty plan, i.e. nothing happens.
  function planPlay(held, mode) {
    var ps = sortedHeld(held);
    if (mode === "down") ps.reverse();
    return ps.map(function (p, i) {
      return { s: p.s, f: p.f, midi: midiAt(p.s, p.f), hz: hzAt(p.s, p.f), when: mode === "together" ? 0 : i * STAGGER };
    });
  }
  // --- end pure math -----------------------------------------------------

  if (typeof document === "undefined") {           // node test harness
    module.exports = { A4_HZ: A4_HZ, TUNING: TUNING, FRETS: FRETS, STAGGER: STAGGER, ROE: ROE, midiToHz: midiToHz, midiToName: midiToName, fretFraction: fretFraction, fretCents: fretCents, fret12DriftCents: fret12DriftCents, midiAt: midiAt, hzAt: hzAt, posKey: posKey, planPlay: planPlay };
    return;
  }

  var NS = "http://www.w3.org/2000/svg";
  var $ = function (id) { return document.getElementById(id); };
  var svg = $("svg"), held = new Set(), pts = {};
  var NS_ = TUNING.length;

  // Geometry (viewBox units). Frets are spaced by the REAL Rule-of-Eighteen fraction, not by
  // 2^(-n/12): fret n sits at NUT + BOARD * (1 - fretFraction(n)), so the drawing itself shows
  // the drift, not just a number in a tooltip.
  var NUT = 72, BOARD = 560, TOP = 40, GAP = 28, W = 650, H = 246;
  function fretX(n) { return NUT + BOARD * (1 - fretFraction(n)); }
  // Where a TRUE equal-tempered fret 12 (an exact octave, half the open length) would sit —
  // drawn as a second, dashed marker so the gap from the real fret 12 is visible, not just stated.
  var TRUE12_X = NUT + BOARD * 0.5;
  // The clickable position for fret n: the middle of its cell, or (open string) just left of the nut.
  function posX(f) { return f === 0 ? NUT - 22 : (fretX(f - 1) + fretX(f)) / 2; }
  function stringY(s) { return TOP + (NS_ - 1 - s) * GAP; }     // high course on top, like tablature
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);

  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var a in attrs) n.setAttribute(a, attrs[a]);
    if (parent) parent.appendChild(n);
    return n;
  }

  // Static drawing first (under the clickable positions).
  var MARKS = [0, 3, 5, 7, 9, 12];
  MARKS.forEach(function (f) {           // fret numbers, top, in the Axis color
    var t = el("text", { x: posX(f), y: 16, "text-anchor": "middle", "font-size": 11, fill: "#666666" }, svg);
    t.textContent = f;
  });
  [3, 5, 7, 9].forEach(function (f) {    // single inlay dots
    el("circle", { cx: posX(f), cy: (stringY(2) + stringY(3)) / 2, r: 5, fill: "#F2F2EC" }, svg);
  });
  [1.5, 3.5].forEach(function (i) {      // double inlay at the octave
    el("circle", { cx: posX(12), cy: TOP + i * GAP, r: 5, fill: "#F2F2EC" }, svg);
  });
  for (var f = 1; f <= FRETS; f++)       // Rule-of-Eighteen fret wires (gut, tied on — drawn a touch
    el("line", { x1: fretX(f), y1: TOP - 10, x2: fretX(f), y2: stringY(0) + 10, stroke: "#A69B91", "stroke-width": 1 }, svg);
  // The true equal-tempered fret-12 marker: dashed, in the accent color, distinct from every
  // real (gut) fret. It sits closer to the bridge than the real fret 12, because a true octave
  // is a SHORTER remaining length than the Rule of Eighteen gets you to (i.e. the real fret is flat).
  el("line", { id: "true12", x1: TRUE12_X, y1: TOP - 14, x2: TRUE12_X, y2: stringY(0) + 14, stroke: "#D72027", "stroke-width": 1.5, "stroke-dasharray": "4 3" }, svg);
  el("line", { id: "nut", x1: NUT, y1: TOP - 10, x2: NUT, y2: stringY(0) + 10, stroke: "#2B2B2B", "stroke-width": 4 }, svg);   // the nut
  for (var s = 0; s < NS_; s++) {        // courses: lower ones are thicker
    el("line", { x1: NUT, y1: stringY(s), x2: NUT + BOARD, y2: stringY(s), stroke: "#666666", "stroke-width": 2.2 - s * 0.28 }, svg);
    var lb = el("text", { x: 34, y: stringY(s) + 4, "text-anchor": "end", "font-size": 11, fill: "#555555" }, svg);
    lb.textContent = midiToName(TUNING[s]);
  }
  // Legend: what the solid gut frets are vs. the dashed true-octave marker.
  var legY = stringY(0) + 34;
  el("line", { x1: NUT, y1: legY, x2: NUT + 18, y2: legY, stroke: "#A69B91", "stroke-width": 1 }, svg);
  var l1 = el("text", { x: NUT + 24, y: legY + 4, "font-size": 11, fill: "#555555" }, svg);
  l1.textContent = "Rule of Eighteen fret (what a lutenist ties)";
  var legX2 = NUT + 260;
  el("line", { x1: legX2, y1: legY, x2: legX2 + 18, y2: legY, stroke: "#D72027", "stroke-width": 1.5, "stroke-dasharray": "4 3" }, svg);
  var l2 = el("text", { x: legX2 + 24, y: legY + 4, "font-size": 11, fill: "#555555" }, svg);
  l2.textContent = "true equal-tempered fret 12 (exact octave)";

  // Roving tabindex: 78 Tab stops would be unusable, so the fretboard is a single
  // Tab stop and the arrow keys move between positions.
  var cur = { s: 0, f: 0 };
  function setCur(s, f, focus) {
    pts[posKey(cur.s, cur.f)].setAttribute("tabindex", "-1");
    cur = { s: s, f: f };
    var g = pts[posKey(s, f)];
    g.setAttribute("tabindex", "0");
    if (focus) { try { g.focus({ preventScroll: false }); } catch (_) {} }
  }
  function makePoint(s, f) {
    var m = midiAt(s, f), x = posX(f), y = stringY(s), key = posKey(s, f);
    var g = el("g", { "class": "pt", tabindex: "-1", role: "button", "aria-pressed": "false",
                      "aria-label": midiToName(m) + ", course " + (s + 1) + ", fret " + f }, svg);
    el("circle", { "class": "disc", cx: x, cy: y, r: 12 }, g);
    el("circle", { "class": "dot", cx: x, cy: y, r: 3.5 }, g);
    // A generous invisible hit target: the whole fret cell, one course row tall.
    var half = f === 0 ? 14 : (fretX(f) - fretX(f - 1)) / 2 - 1;
    el("rect", { x: x - half, y: y - 13, width: half * 2, height: 26, fill: "transparent" }, g);
    var t = el("text", { x: x, y: y + 3, "text-anchor": "middle" }, g);
    t.textContent = midiToName(m);
    pts[key] = g;
    return g;
  }
  for (s = 0; s < NS_; s++) for (f = 0; f <= FRETS; f++) makePoint(s, f);
  Object.keys(pts).forEach(function (key) {
    var p = parseKey(key), g = pts[key];
    g.addEventListener("click", function () { setCur(p.s, p.f, false); toggle(key); try { g.focus({ preventScroll: true }); } catch (_) {} });
    g.addEventListener("focus", function () { if (cur.s !== p.s || cur.f !== p.f) setCur(p.s, p.f, false); });
    g.addEventListener("keydown", function (e) {
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      var ns = p.s, nf = p.f;
      if (e.key === "Enter" || e.key === " ") { toggle(key); e.preventDefault(); return; }   // Space would otherwise scroll
      if (e.key === "ArrowRight") nf = Math.min(FRETS, p.f + 1);
      else if (e.key === "ArrowLeft") nf = Math.max(0, p.f - 1);
      else if (e.key === "ArrowUp") ns = Math.min(NS_ - 1, p.s + 1);      // toward the high course
      else if (e.key === "ArrowDown") ns = Math.max(0, p.s - 1);
      else return;
      e.preventDefault();
      setCur(ns, nf, true);
    });
  });
  pts[posKey(0, 0)].setAttribute("tabindex", "0");

  function toggle(key) {
    if (held.has(key)) held.delete(key); else held.add(key);
    render();
  }
  function render() {
    for (var k in pts) {
      var on = held.has(k);
      pts[k].classList.toggle("held", on);
      pts[k].setAttribute("aria-pressed", on ? "true" : "false");
    }
  }

  // --- Web Audio: OscillatorNode notes ----------------------------------
  var ctx = null, wave = null;
  function audio() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      // same plucked-string-ish spectrum as the monochord, piano and guitar
      var re = new Float32Array(7), im = new Float32Array(7);
      for (var n = 1; n < 7; n++) im[n] = 1 / (n * n);
      wave = ctx.createPeriodicWave(re, im);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function pluck(hz, when, peak) {
    var c = audio(); if (!c) return;
    var t0 = c.currentTime + (when || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.setPeriodicWave(wave); o.frequency.value = hz;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.01);   // quick attack
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 4.4);  // ring out
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + 4.6);
  }
  function play(mode) {
    var plan = planPlay(held, mode);
    if (!plan.length) return;                                // nothing held: do nothing
    // Chords stack partials, so scale each voice down to keep the sum from clipping.
    var peak = 0.28 / Math.sqrt(mode === "together" ? plan.length : 1);
    plan.forEach(function (n) { pluck(n.hz, n.when, peak); });
  }
  $("bT").addEventListener("click", function () { play("together"); });
  $("bU").addEventListener("click", function () { play("up"); });
  $("bD").addEventListener("click", function () { play("down"); });
  $("bC").addEventListener("click", function () { held.clear(); render(); });

  render();
})();
</script>
</body>
</html>
